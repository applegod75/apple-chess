name: build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout src
        uses: actions/checkout@v4

      - name: install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: compile
        run: |
          mkdir -p build
          gcc -o build/magic_generator  magic_generator/main.c -O3 -std=c2x
          ./build/magic_generator src/autogenerated-magics
          gcc -o ./build/main src/moves.c src/attacks.c src/autogenerated-magics.c src/board.c src/main.c -O3 -std=c2x

      - name: Run
        run: ./build/main
